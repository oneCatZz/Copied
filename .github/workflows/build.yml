name: Build Copied

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows/amd64
            artifact: Copied-windows-amd64
            path: build/windows-amd64/
          - name: macOS Universal
            runner: macos-latest
            platform: darwin/universal
            artifact: Copied-macos-universal
            path: build/darwin-universal/*.dmg
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare patched MyGo
        run: go run ./scripts/prepare-mygo.go
      - name: Test MyGo renderer patch
        run: go test -count=1 github.com/egoist/mygo/internal/scene
      - name: Test
        run: go test -count=1 ./...
      - name: Test Windows native paste
        if: runner.os == 'Windows'
        env:
          COPIED_NATIVE_TEST: "1"
        run: |
          gofmt -d platform_windows.go platform_windows_test.go
          go test -count=1 -v -run '^TestWindowsPasteNative$' .
      - name: Check MyGo UI lifetimes
        run: go tool mygo vet .
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/import-signing-certificate.sh
      - name: Package
        shell: bash
        run: |
          if [ -z "${MACOS_SIGNING_IDENTITY:-}" ]; then
            go tool mygo build -platform ${{ matrix.platform }}
            exit 0
          fi
          # Signing asks Apple's timestamp server, which sometimes refuses.
          for attempt in 1 2 3 4 5; do
            go tool mygo build -platform ${{ matrix.platform }} -sign "$MACOS_SIGNING_IDENTITY" && exit 0
            echo "Signing failed (attempt $attempt), retrying."
            sleep 15
          done
          exit 1
      - name: Remove macOS signing keychain
        if: always() && env.MACOS_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

