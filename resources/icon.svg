<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7584ff"/>
      <stop offset="1" stop-color="#4534c8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dee3ff"/>
      <stop offset="1" stop-color="#aab6ff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24156b" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="101" y="101" width="822" height="822" rx="189" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
  <rect x="428" y="260" width="308" height="392" rx="62" fill="url(#back)"/>
  <rect x="288" y="372" width="308" height="392" rx="62" fill="url(#paper)" filter="url(#shadow)"/>
  <g fill="#6264db">
    <rect x="352" y="484" width="180" height="26" rx="13"/>
    <rect x="352" y="566" width="118" height="26" rx="13"/>
  </g>
</svg>
